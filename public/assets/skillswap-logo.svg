<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="topArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="bottomArrowGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="textSwapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" flood-color="#0f172a" />
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Main S Icon -->
    <g id="logo-mark" filter="url(#subtleShadow)">
      <!-- Top Sweeping Arrow (Blue) -->
      <path d="M 230 190 
               C 210 190 192 180 185 160 
               C 175 130 195 90 245 80 
               C 295 70 345 100 355 150 
               C 360 175 350 205 325 225 
               L 315 200 
               C 332 185 338 165 335 150 
               C 328 115 290 95 250 102 
               C 215 108 202 135 208 155 
               C 214 170 225 174 235 174 
               Z" fill="url(#topArrowGrad)" />
      
      <!-- Top Arrow Head -->
      <path d="M 330 115 L 375 160 L 315 175 Z" fill="#1e40af" />

      <!-- Full Smooth S Sweeps -->
      <!-- Top Arc -->
      <path d="M 200 205 
               C 180 170 185 120 225 90 
               C 275 55 350 75 365 140 
               C 375 180 355 220 310 245 
               C 290 256 270 262 250 262 
               L 250 238 
               C 268 238 285 232 300 222 
               C 335 202 348 170 340 138 
               C 328 88 270 75 235 102 
               C 205 125 200 162 215 190 
               Z" fill="url(#topArrowGrad)" />

      <!-- Bottom Sweeping Arrow (Green) -->
      <path d="M 300 295 
               C 320 330 315 380 275 410 
               C 225 445 150 425 135 360 
               C 125 320 145 280 190 255 
               C 210 244 230 238 250 238 
               L 250 262 
               C 232 262 215 268 200 278 
               C 165 298 152 330 160 362 
               C 172 412 230 425 265 398 
               C 295 375 300 338 285 310 
               Z" fill="url(#bottomArrowGrad)" />
      
      <!-- Bottom Arrow Head -->
      <path d="M 170 385 L 125 340 L 185 325 Z" fill="#059669" />

      <!-- Center Messaging Dots -->
      <circle cx="232" cy="250" r="13" fill="#0f172a" />
      <circle cx="268" cy="250" r="13" fill="#0f172a" />
    </g>

    <!-- Typography -->
    <g id="logo-text">
      <!-- SKILL -->
      <text x="110" y="445" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="6" fill="#0f172a">SKILL</text>
      <!-- SWAP -->
      <text x="270" y="445" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="6" fill="url(#textSwapGrad)">SWAP</text>

      <!-- Tagline & Divider Lines -->
      <line x1="85" y1="472" x2="165" y2="472" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
      <text x="250" y="476" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#334155">LEARN • TEACH • GROW</text>
      <line x1="335" y1="472" x2="415" y2="472" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
